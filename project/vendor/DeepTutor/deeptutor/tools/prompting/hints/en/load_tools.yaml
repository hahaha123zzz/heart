short_description: "Load on-demand tools (catalog entries with no parameters shown, plus MCP Extended Tools) so they become callable in this session."
when_to_use: "Use when the task needs a tool the catalog lists as on-demand, or an Extended Tool not yet loaded. Calling one before loading fails."
input_format: "`names` is an array of exact tool names from the catalog."
guideline: "Load only what this task needs; do not load the whole catalog. Loaded tools stay callable for this turn; the next turn re-selects by scene."
note: "If a name comes back unknown, check the spelling against the catalog."
phase: "exploration"
