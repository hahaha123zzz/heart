short_description: "加载按需工具（工具清单里只列名称、未直接给出参数的条目，含 MCP 扩展工具），使其在本会话中可调用。"
when_to_use: "当任务需要工具清单中标注为按需、或「Extended Tools」清单中尚未加载的工具时使用。未加载就直接调用会失败。"
input_format: "`names` 是字符串数组，工具名须与清单中的名称完全一致。"
guideline: "只加载当前任务需要的工具，不要整批加载。加载后本回合内持续可用；下一回合按场景重新选择。"
note: "若返回 unknown，回到工具清单核对名字拼写。"
phase: "exploration"
