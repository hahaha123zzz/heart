<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>实验心理学 · 样章阅读与问答</title>
<link rel="stylesheet" href="/static/pdf-reader/reader.css">
<style>
body{margin:0;font-family:'Microsoft YaHei',sans-serif;color:#293943}header{padding:14px 20px;border-bottom:1px solid #ddd;display:flex;gap:16px;align-items:center}header a{margin-left:auto}main{display:grid;grid-template-columns:360px 1fr;height:calc(100dvh - 58px)}aside{padding:18px;overflow:auto;background:#f5f7f8}button,input,textarea{font:inherit;padding:8px;border:1px solid #cbd4da;border-radius:5px;background:white}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}.section-button{display:block;width:100%;text-align:left;margin-bottom:8px}#reader{min-width:0;min-height:0;height:100%}.hit,#answer{margin:14px 0;padding:10px;background:white;border:1px solid #ddd;border-radius:6px}.hit p{white-space:pre-wrap;font-size:13px;max-height:160px;overflow:auto}small,summary{color:#667782}form{display:flex;gap:6px}input{min-width:0;flex:1}#ask{flex-direction:column}textarea{resize:vertical;min-height:64px}#selection-note{font-size:13px}.answer-text{white-space:pre-wrap;line-height:1.8;font-size:14px}.citation{display:block;margin:8px 0;text-align:left;font-size:13px}mark{background:#fff1a8}summary{cursor:pointer;font-size:13px}details p{font-size:13px}#answer:empty{display:none}@media(max-width:700px){main{grid-template-columns:1fr;grid-template-rows:280px 1fr}header{font-size:13px;flex-wrap:wrap}}
</style></head><body>
<header><strong>实验心理学（第3版）· 第四章样章</strong><small>生成阅读版页码</small></header>
<main><aside><nav id="sections"></nav>
<h3>检索本章教材</h3><form id="search"><input id="query" aria-label="检索关键词" required maxlength="400" placeholder="例如：随机区组设计"><button>检索</button></form><p id="status" role="status"></p><div id="hits"></div>
<h3>向教材助教提问</h3><small>回答依据仅限第四章；也可选中文字后提问。</small><p id="selection-note" hidden></p><button id="clear-selection" type="button" hidden>取消选区</button>
<form id="ask"><textarea id="question" aria-label="向教材助教提问" required maxlength="400" placeholder="例如：随机区组设计为什么能控制个体差异？"></textarea><button id="submit-question">提问</button></form>
<p id="qa-status" role="status"></p><details id="qa-process" hidden><summary>查看处理记录</summary><p id="qa-detail"></p></details><div id="answer" aria-live="polite"></div>
</aside><div id="reader"></div></main>
<script src="/static/chat-renderer.js"></script><script type="module">
import '/static/pdf-reader/reader.js';
const record=await fetch('/api/textbook-preview/psychology/catalog').then(r=>r.json()),host=document.querySelector('#reader');
let selection=null;
function chooseSelection(value){selection=value;document.querySelector('#selection-note').hidden=false;document.querySelector('#selection-note').textContent='已选中第'+value.rects[0].page+'页内容，可补充问题后提交';document.querySelector('#clear-selection').hidden=false;const input=document.querySelector('#question');input.value='请解释我选中的教材内容。';input.focus();input.scrollIntoView({block:'nearest'});}
function openSection(section,reference=null){const metadata={...record,chapter_id:4,url:'/api/textbook-preview/psychology/pdf',section:{...section,page:section.generated_page,y:section.rect.y1}};window.TextbookPDF.mount(host,metadata,reference,chooseSelection);}
for(const section of record.sections){const b=document.createElement('button');b.className='section-button';b.textContent=section.title+' · 第'+section.generated_page+'页';b.onclick=()=>openSection(section,{document_id:record.document_id,version:record.version,rects:[section.rect]});document.querySelector('#sections').append(b);}openSection(record.sections[0]);
document.querySelector('#clear-selection').onclick=()=>{selection=null;document.querySelector('#selection-note').hidden=true;document.querySelector('#clear-selection').hidden=true;};
document.querySelector('#search').onsubmit=async event=>{event.preventDefault();const status=document.querySelector('#status'),hits=document.querySelector('#hits');status.textContent='正在检索…';hits.replaceChildren();try{const response=await fetch('/api/textbook-preview/psychology/search?'+new URLSearchParams({q:document.querySelector('#query').value}));if(!response.ok)throw new Error('检索暂不可用');const results=await response.json();status.textContent='找到'+results.length+'条相关教材内容';for(const hit of results){const card=document.createElement('section'),title=document.createElement('strong'),p=document.createElement('p'),b=document.createElement('button');card.className='hit';title.textContent=hit.section;p.textContent=hit.text;b.textContent='定位教材原文';b.onclick=()=>openSection(record.sections.find(s=>s.id===hit.reference.section_id),hit.reference);card.append(title,p,b);hits.append(card);}}catch(error){status.textContent=error.message;}};
document.querySelector('#ask').onsubmit=async event=>{
 event.preventDefault();const submit=document.querySelector('#submit-question'),status=document.querySelector('#qa-status'),answer=document.querySelector('#answer'),details=document.querySelector('#qa-process'),detail=document.querySelector('#qa-detail');
 submit.disabled=true;status.textContent='正在查阅教材并核验回答…';answer.replaceChildren();details.hidden=false;details.open=false;detail.textContent='正在检索第四章，核验依据、生成解释并检查引用。';
 try{const response=await fetch('/api/textbook-preview/psychology/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:document.querySelector('#question').value,version:record.version,selection})});const result=await response.json();if(!response.ok)throw new Error(typeof result.detail==='string'?result.detail:'问题或选区无效，请重新选择');
 answer.innerHTML=window.renderTutorAnswer(result.answer);status.textContent=result.status==='completed'?'回答已完成并通过核对':'本次未完成回答';detail.textContent=result.reason||result.answer;
 for(const citation of result.citations){const b=document.createElement('button');b.className='citation';const ref=citation.reference;b.textContent='['+citation.id+'] '+citation.section+' · 第'+ref.rects[0].page+'页'+(ref.location_kind==='section_heading'?'（定位到小节标题）':'');b.onclick=()=>openSection(record.sections.find(s=>s.id===ref.section_id),ref);answer.append(b);}
 }catch(error){status.textContent=error instanceof TypeError?'连接失败，请确认样章服务正在运行':error.message;detail.textContent=status.textContent;}finally{submit.disabled=false;}
};
</script></body></html>
